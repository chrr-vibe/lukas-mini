# 안드로이드 앱(APK) 자동 빌드
# android 폴더가 바뀌어서 main 에 올라가면 APK 를 만들어 Releases 에 올림.
# (Actions 탭 → "안드로이드 앱 빌드" → Run workflow 로 직접 돌려도 됨)
# 화면(index.html 등)만 고칠 때는 앱을 다시 만들 필요 없음 — 앱이 GitHub Pages 주소를 그대로 띄우기 때문.
name: 안드로이드 앱 빌드

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 앱이 열 웹 주소 정하기
        env:
          CUSTOM_URL: ${{ vars.WEB_URL }}
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_URL" ]; then URL="$CUSTOM_URL"
          elif [ "$(echo "$REPO" | tr 'A-Z' 'a-z')" = "$OWNER.github.io" ]; then URL="https://$OWNER.github.io/"
          else URL="https://$OWNER.github.io/$REPO/"; fi
          echo "웹 주소: $URL"
          cat > android/app/src/main/res/values/web_url.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="web_url" translatable="false">$URL</string>
          </resources>
          XML

      - name: 서명 열쇠 (Secrets 에 있으면 그걸 사용)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi

      - name: APK 만들기
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          [ -z "$KEYSTORE_PASSWORD" ] && unset KEYSTORE_PASSWORD
          [ -z "$KEY_ALIAS" ] && unset KEY_ALIAS
          gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../LUCASGOTCHI-mini.apk

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: LUCASGOTCHI mini 앱 v1.${{ github.run_number }}
          make_latest: true
          files: LUCASGOTCHI-mini.apk
          body: |
            휴대폰에서 아래 **LUCASGOTCHI-mini.apk** 를 눌러 받은 뒤 설치하세요.
            (처음 한 번은 "출처를 알 수 없는 앱 설치 허용"이 필요해요.)
