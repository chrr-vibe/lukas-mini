# 카카오톡 테마(안드로이드 APK) 자동 빌드
# kakao-theme 폴더가 바뀌어서 main 에 올라가면 테마 APK 를 만들어 Releases 에 올림.
# 그림은 kakao-theme/gen.py 로 미리 만들어 kakao-theme/theme/ 에 올려 둔 것을 kakao-theme/apk(Gradle) 로 묶음.
name: 카카오톡 테마 빌드

on:
  push:
    branches: [main]
    paths:
      - 'kakao-theme/**'
      - '.github/workflows/kakao-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 테마 APK 만들기
        working-directory: kakao-theme
        run: |
          gradle :apk:assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
          cp apk/build/outputs/apk/release/apk-release.apk ../LUCASGOTCHI-kakaotheme.apk

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theme-v${{ github.run_number }}
          name: 카카오톡 테마 (루카스고치 별밤) v1.${{ github.run_number }}
          make_latest: false
          files: LUCASGOTCHI-kakaotheme.apk
          body: |
            갤럭시(안드로이드)용 카카오톡 테마예요.
            1. 아래 **LUCASGOTCHI-kakaotheme.apk** 를 받아서 설치
            2. 앱 목록의 **루카스고치 별밤** 을 열고 **테마 적용하기**
               (또는 카카오톡 → 설정 → 화면 → 테마 → 루카스고치 별밤)
