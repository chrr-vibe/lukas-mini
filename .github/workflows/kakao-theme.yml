# 카카오톡 테마(안드로이드 APK) 자동 빌드
# kakao-theme 폴더가 바뀌어서 main 에 올라가면 테마 APK 를 만들어 Releases 에 올림.
# 그림은 kakao-theme/gen.py 로 미리 만들어 kakao-theme/theme/ 에 올려 둔 것을 그대로 묶기만 함.
name: 카카오톡 테마 빌드

on:
  push:
    branches: [main]
    paths:
      - 'kakao-theme/**'
      - '.github/workflows/kakao-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 테마 APK 만들기 (aapt2 → zipalign → apksigner)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          echo "build-tools: $BT / platform: $PLAT"
          VC=${{ github.run_number }}
          "$BT/aapt2" compile --dir kakao-theme/theme/res -o res.zip
          "$BT/aapt2" link -o unsigned.apk -I "$PLAT/android.jar" \
            --manifest kakao-theme/theme/AndroidManifest.xml \
            --version-code "$VC" --version-name "1.$VC" res.zip
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks android/app/lucasgotchi.keystore --ks-key-alias lucasgotchi \
            --ks-pass pass:lucasgotchi --key-pass pass:lucasgotchi \
            --v4-signing-enabled false --out LUCASGOTCHI-kakaotheme.apk aligned.apk
          "$BT/apksigner" verify LUCASGOTCHI-kakaotheme.apk
          "$BT/aapt2" dump badging LUCASGOTCHI-kakaotheme.apk | head -3

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theme-v${{ github.run_number }}
          name: 카카오톡 테마 (루카스고치 별밤) v1.${{ github.run_number }}
          make_latest: false
          files: LUCASGOTCHI-kakaotheme.apk
          body: |
            갤럭시(안드로이드)용 카카오톡 테마예요.
            1. 아래 **LUCASGOTCHI-kakaotheme.apk** 를 받아서 설치
            2. 카카오톡 → 더보기 → 설정 → 화면 → 테마 → **루카스고치 별밤** → 적용
